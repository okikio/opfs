services:
  s3:
    image: chrislusf/seaweedfs:4.41
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: secret
      S3_BUCKET: opfs-test
    ports:
      - "8333:8333"
    volumes:
      - s3-data:/data

  azure:
    image: mcr.microsoft.com/azure-storage/azurite:3.36.0
    command:
      - azurite-blob
      - --blobHost
      - 0.0.0.0
      - --skipApiVersionCheck
      - --disableTelemetry
      - --inMemoryPersistence
    ports:
      - "10000:10000"

volumes:
  s3-data:
