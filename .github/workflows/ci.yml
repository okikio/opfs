name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno node
      - name: Lint commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: deno task commits

  quality:
    name: Deno quality and package dry-runs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno node npm:npm
      - run: deno task quality

  deno:
    name: Deno ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno node
      - run: deno task deps:ci && deno task test

  node:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22"
          - os: ubuntu-latest
            node: "24"
          - os: ubuntu-latest
            node: "26"
          - os: macos-latest
            node: "26"
          - os: windows-latest
            node: "26"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      MISE_NODE_VERSION: ${{ matrix.node }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno node
          cache_key_prefix: mise-node-${{ matrix.node }}
      - run: deno task deps:ci && deno task test:node

  bun:
    name: Bun / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno bun
      - run: deno task deps:ci && deno task test:bun

  browser:
    name: Playwright browser matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno
      - run: deno task deps:ci && deno task test:browser:install && deno task test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-evidence
          if-no-files-found: error
          path: .tmp/reports/browser
          include-hidden-files: true

  providers:
    name: Storage provider containers and archive preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno node
      - run: deno task deps:ci && deno task test:providers
      - run: deno task test:expansion:providers
      - run: deno task test:archive:interop

  firebase:
    name: Firebase Rules and native upload containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno node
      - run: deno task deps:ci && deno task test:firebase-provider

  lfs:
    name: Git LFS native repository containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno node
      - run: deno task deps:ci && deno task test:lfs-provider

  pocketbase:
    name: PocketBase native record-file containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno node
      - run: deno task deps:ci && deno task test:pocketbase-provider

  supabase:
    name: Supabase native REST and RLS containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno node
      - run: deno task deps:ci && deno task test:supabase-provider

  nextcloud:
    name: Nextcloud native chunk-upload containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno node
      - run: deno task deps:ci && deno task test:nextcloud-provider

  restic:
    name: Restic native repository object containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno node
      - run: deno task deps:ci && deno task test:restic-provider

  lakefs:
    name: lakeFS native staging and committed object containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno node
      - run: deno task deps:ci && deno task test:lakefs-provider

  seafile:
    name: Seafile native library and capability containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno node
      - run: deno task deps:ci && deno task test:seafile-provider

  ocis:
    name: ownCloud Infinite Scale native compatibility containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno node
      - run: deno task deps:ci && deno task test:ocis-provider

  cmis:
    name: CMIS native repository and SDK containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno node
      - run: deno task deps:ci && deno task test:cmis-provider

  couchdb:
    name: CouchDB attachment MVCC and SDK containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno node
      - run: deno task deps:ci && deno task test:couchdb-provider

  gcs-archive:
    name: GCS Archive class SDK interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno node
      - run: deno task deps:ci && deno task test:gcs-archive-provider

  npm-package:
    name: npm tarball consumers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno node bun
      - run: deno task verify:npm

  bench:
    name: Server benchmark smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno node bun
      - run: deno task bench:all
      - run: |
          mkdir -p .tmp/reports/archive-bench
          BENCH_JSON=1 deno task bench:archive > .tmp/reports/archive-bench/mitata.json 2> .tmp/reports/archive-bench/stderr.log
          BENCH_JSON=1 deno task bench:tar > .tmp/reports/archive-bench/tar.json 2> .tmp/reports/archive-bench/tar-stderr.log
          BENCH_JSON=1 deno task bench:compress > .tmp/reports/archive-bench/compress.json 2> .tmp/reports/archive-bench/compress-stderr.log
          BENCH_JSON=1 deno task bench:cpio > .tmp/reports/archive-bench/cpio.json 2> .tmp/reports/archive-bench/cpio-stderr.log
          BENCH_JSON=1 deno task bench:cab > .tmp/reports/archive-bench/cab.json 2> .tmp/reports/archive-bench/cab-stderr.log
          BENCH_JSON=1 deno task bench:seven > .tmp/reports/archive-bench/seven.json 2> .tmp/reports/archive-bench/seven-stderr.log
          BENCH_JSON=1 deno task bench:xz > .tmp/reports/archive-bench/xz.json 2> .tmp/reports/archive-bench/xz-stderr.log
          BENCH_JSON=1 deno task bench:bzip > .tmp/reports/archive-bench/bzip.json 2> .tmp/reports/archive-bench/bzip-stderr.log
          BENCH_JSON=1 deno task bench:udf > .tmp/reports/archive-bench/udf.json 2> .tmp/reports/archive-bench/udf-stderr.log
          BENCH_JSON=1 deno task bench:wim > .tmp/reports/archive-bench/wim.json 2> .tmp/reports/archive-bench/wim-stderr.log
          BENCH_JSON=1 deno task bench:fits > .tmp/reports/archive-bench/fits.json 2> .tmp/reports/archive-bench/fits-stderr.log
          BENCH_JSON=1 deno task bench:netcdf > .tmp/reports/archive-bench/netcdf.json 2> .tmp/reports/archive-bench/netcdf-stderr.log
          BENCH_JSON=1 deno task bench:arfs > .tmp/reports/archive-bench/arfs.json 2> .tmp/reports/archive-bench/arfs-stderr.log
          BENCH_JSON=1 deno task bench:las > .tmp/reports/archive-bench/las.json 2> .tmp/reports/archive-bench/las-stderr.log
          BENCH_JSON=1 deno task bench:zip-bzip > .tmp/reports/archive-bench/zip-bzip.json 2> .tmp/reports/archive-bench/zip-bzip-stderr.log
          BENCH_JSON=1 deno task bench:zip-lzma > .tmp/reports/archive-bench/zip-lzma.json 2> .tmp/reports/archive-bench/zip-lzma-stderr.log
          BENCH_JSON=1 deno task bench:arweave > .tmp/reports/archive-bench/arweave.json 2> .tmp/reports/archive-bench/arweave-stderr.log
          BENCH_JSON=1 deno task bench:couchdb > .tmp/reports/archive-bench/couchdb.json 2> .tmp/reports/archive-bench/couchdb-stderr.log
          BENCH_JSON=1 deno task bench:cmis > .tmp/reports/archive-bench/cmis.json 2> .tmp/reports/archive-bench/cmis-stderr.log
          BENCH_JSON=1 deno task bench:lha > .tmp/reports/archive-bench/lha.json 2> .tmp/reports/archive-bench/lha-stderr.log
          BENCH_JSON=1 deno task bench:hdf5 > .tmp/reports/archive-bench/hdf5.json 2> .tmp/reports/archive-bench/hdf5-stderr.log
          BENCH_JSON=1 deno task bench:zarr > .tmp/reports/archive-bench/zarr.json 2> .tmp/reports/archive-bench/zarr-stderr.log
          BENCH_JSON=1 deno task bench:unixfs > .tmp/reports/archive-bench/unixfs.json 2> .tmp/reports/archive-bench/unixfs-stderr.log
          BENCH_JSON=1 deno task bench:rar > .tmp/reports/archive-bench/rar.json 2> .tmp/reports/archive-bench/rar-stderr.log
          BENCH_JSON=1 deno task bench:ar > .tmp/reports/archive-bench/ar.json 2> .tmp/reports/archive-bench/ar-stderr.log
          BENCH_JSON=1 deno task bench:lz4 > .tmp/reports/archive-bench/lz4.json 2> .tmp/reports/archive-bench/lz4-stderr.log
      - run: deno task bench:upstream:verify
      - run: |
          mkdir -p .tmp/reports/upstream-bench
          BENCH_JSON=1 deno task bench:upstream > .tmp/reports/upstream-bench/mitata.json 2> .tmp/reports/upstream-bench/stderr.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: upstream-truncate-benchmark-evidence
          if-no-files-found: error
          path: .tmp/reports/upstream-bench
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: archive-benchmark-evidence
          if-no-files-found: error
          path: .tmp/reports/archive-bench

  provider-bench:
    name: Provider baseline benchmark smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno node bun
      - run: deno task deps:ci && deno task bench:providers

  browser-bench:
    name: Browser OPFS benchmark smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno
      - run: deno task deps:ci && deno task test:browser:install && deno task bench:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-benchmark-evidence
          if-no-files-found: error
          path: .tmp/reports/browser-bench
          include-hidden-files: true

  ecosystems:
    name: Installed ecosystem contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno node npm:npm
      - run: deno task deps:ci && deno task test:ecosystems
