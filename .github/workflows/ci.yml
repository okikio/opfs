name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno node
      - name: Lint commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: deno task commits

  quality:
    name: Deno quality and package dry-runs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno node npm:npm
      - run: deno task quality

  deno:
    name: Deno ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno node
      - run: deno task deps:ci && deno task test

  node:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22"
          - os: ubuntu-latest
            node: "24"
          - os: ubuntu-latest
            node: "26"
          - os: macos-latest
            node: "26"
          - os: windows-latest
            node: "26"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      MISE_NODE_VERSION: ${{ matrix.node }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno node
          cache_key_prefix: mise-node-${{ matrix.node }}
      - run: deno task deps:ci && deno task test:node

  bun:
    name: Bun / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno bun
      - run: deno task deps:ci && deno task test:bun

  browser:
    name: Playwright browser matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno
      - name: Use Ubuntu's primary archive for browser dependencies
        run: |
          for source in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [ -f "$source" ]; then
              sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
      - run: deno task deps:ci && deno task test:browser:install && deno task test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-evidence
          if-no-files-found: error
          path: .tmp/reports/browser
          include-hidden-files: true

  providers:
    name: Storage provider containers and archive preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno node
      - run: deno task deps:ci && deno task test:providers
      - run: deno task test:expansion:providers
      - name: Install independent archive consumers
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends 7zip libarchive-tools
      - run: deno task test:archive:interop
        env:
          OPFS_SEVEN: /usr/bin/7z

  firebase:
    name: Firebase Rules and native upload containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno node
      - run: deno task deps:ci && deno task test:firebase-provider

  lfs:
    name: Git LFS native repository containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno node
      - run: deno task deps:ci && deno task test:lfs-provider

  pocketbase:
    name: PocketBase native record-file containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno node
      - run: deno task deps:ci && deno task test:pocketbase-provider

  supabase:
    name: Supabase native REST and RLS containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno node
      - run: deno task deps:ci && deno task test:supabase-provider

  nextcloud:
    name: Nextcloud native chunk-upload containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno node
      - run: deno task deps:ci && deno task test:nextcloud-provider

  restic:
    name: Restic native repository object containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno node
      - run: deno task deps:ci && deno task test:restic-provider

  lakefs:
    name: lakeFS native staging and committed object containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno node
      - run: deno task deps:ci && deno task test:lakefs-provider

  seafile:
    name: Seafile native library and capability containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno node
      - run: deno task deps:ci && deno task test:seafile-provider

  ocis:
    name: ownCloud Infinite Scale native compatibility containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno node
      - run: deno task deps:ci && deno task test:ocis-provider

  cmis:
    name: CMIS native repository and SDK containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno node
      - run: deno task deps:ci && deno task test:cmis-provider

  couchdb:
    name: CouchDB attachment MVCC and SDK containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno node
      - run: deno task deps:ci && deno task test:couchdb-provider

  etcd:
    name: etcd native revision and lease containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno node
      - run: deno task deps:ci && deno task test:etcd-provider

  netlify:
    name: Netlify native capability and SDK containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno node
      - run: deno task deps:ci
      - name: Acquire the frozen inert test-only SDK closure
        run: deno task fixtures:netlify --output .tmp/netlify-inert
      - name: Bundle the candidate in the CI compiler lane
        env:
          DENO_V8_FLAGS: --max-old-space-size=1536
        run: deno task bundle:netlify --output .tmp/netlify-candidate.ts
      - name: Compare reciprocal bytes and mutation outcomes
        env:
          DENO_V8_FLAGS: --max-old-space-size=256
          OPFS_NETLIFY_ARTIFACTS: .tmp/netlify-inert
          OPFS_NETLIFY_EXECUTION_REVIEWED: 11.1.7-test-only
          OPFS_NETLIFY_CANDIDATE: .tmp/netlify-candidate.ts
        run: |
          export OPFS_NETLIFY_CLOSURE_SHA256=$(node --input-type=module -e 'import{readFileSync}from"node:fs";import{createHash}from"node:crypto";console.log(createHash("sha256").update(readFileSync(".tmp/netlify-inert/closure.json")).digest("hex"))')
          export OPFS_NETLIFY_CANDIDATE_SHA256=$(node --input-type=module -e 'import{readFileSync}from"node:fs";import{createHash}from"node:crypto";console.log(createHash("sha256").update(readFileSync(".tmp/netlify-candidate.ts")).digest("hex"))')
          deno task test:netlify-provider

  pubsub:
    name: Pub/Sub native message and SDK containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
