name: Publish Registries

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact reviewed 40-character Git commit containing release versions and changelogs
        required: true
        type: string
      target:
        description: Registry to publish; rerun failed jobs to retain the prepared archives
        required: true
        type: choice
        default: both
        options: [both, jsr, npm]
      prepared_run:
        description: Existing preparation run to reuse without rebuilding archives
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: publish-${{ inputs.revision }}
  cancel-in-progress: false

jobs:
  prepare:
    if: inputs.prepared_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Validate source revision
        env:
          REVISION: ${{ inputs.revision }}
        run: '[[ "$REVISION" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno node bun npm:npm
      - run: deno ci
      - name: Install browser engines
        run: deno task test:browser:install
      - name: Prepare the exact tested release
        run: deno task release:prepare
      - name: Preserve package paths in the prepared artifact
        run: |
          mkdir -p .tmp/release-bundle/.tmp/releases .tmp/release-bundle/.release/npm
          cp .tmp/releases/*.json .tmp/release-bundle/.tmp/releases/
          for evidence in .tmp/releases/snapshot-*/dependencies; do
            if [[ -d "$evidence" ]]; then
              mkdir -p ".tmp/release-bundle/$(dirname "$evidence")"
              cp -R "$evidence" ".tmp/release-bundle/$(dirname "$evidence")/"
            fi
          done
          cp .release/npm/*.tgz .tmp/release-bundle/.release/npm/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prepared-${{ inputs.revision }}
          path: .tmp/release-bundle/
          include-hidden-files: true
          retention-days: 30

  publish:
    needs: prepare
    if: ${{ !cancelled() && (needs.prepare.result == 'success' || inputs.prepared_run != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate immutable publication inputs
        env:
          REVISION: ${{ inputs.revision }}
          PREPARED_RUN: ${{ inputs.prepared_run }}
        run: '[[ "$REVISION" =~ ^[a-f0-9]{40}$ && ( -z "$PREPARED_RUN" || "$PREPARED_RUN" =~ ^[1-9][0-9]*$ ) ]]'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.8.6"
          install_args: deno node bun npm:npm
      - run: deno ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: prepared-${{ inputs.revision }}
          run-id: ${{ inputs.prepared_run || github.run_id }}
          github-token: ${{ github.token }}
          path: .
      - name: Restore receipts from the selected preparation run
        if: inputs.prepared_run != '' && github.run_attempt == 1
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: publication-${{ inputs.revision }}-*
          run-id: ${{ inputs.prepared_run }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: .tmp/releases
      - name: Find receipts from the preceding attempt
        id: receipts
        if: github.run_attempt > 1
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          REVISION: ${{ inputs.revision }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          id=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" --paginate --jq ".artifacts | map(select(.name == \"publication-$REVISION-$((ATTEMPT - 1))\")) | .[0].id // empty")
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: github.run_attempt > 1
        with:
          artifact-ids: ${{ steps.receipts.outputs.id }}
          merge-multiple: true
          path: .tmp/releases
      - name: Publish the requested registries
        env:
          TARGET: ${{ inputs.target }}
          REVISION: ${{ inputs.revision }}
        run: |
          test "$(git rev-parse HEAD)" = "$REVISION"
          env GITHUB_SHA="$REVISION" deno task release:publish "$TARGET"
      - name: Select current verification controls
        # Verification controls can be repaired after a partial publication. The
        # prepared source and archive remain in the immutable root checkout.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: .tmp/release-controls
          persist-credentials: false
      - name: Verify exact public package consumers
        env:
          TARGET: ${{ inputs.target }}
        run: deno run -A .tmp/release-controls/.mise/tasks/release-consumer.ts "$TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: publication-${{ inputs.revision }}-${{ github.run_attempt }}
          path: .tmp/releases/
          include-hidden-files: true
          retention-days: 30
